name: Update fuel prices

on:
  schedule:
    # GitHub Actions cron is always UTC (no daylight-saving shift) and the
    # scheduler is best-effort: since 2026-09-30 runs fire hours late and the
    # 05:00 slot was repeatedly skipped. GitHub advises against :00 start
    # times (peak load), so the minutes are deliberately odd, and one extra
    # catch-up run sits mid-morning. Runs only commit when data changed.
    - cron: "17 5 * * *"   # ~07:17 Europe/Berlin (CEST) - morning
    - cron: "23 8 * * *"   # ~10:23 - catch-up if the morning run was skipped
    - cron: "41 11 * * *"  # ~13:41 - after Germany's 12:00 price-change window
    - cron: "23 17 * * *"  # ~19:23 - evening
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update data.json
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          MBENZIN_API_KEY: ${{ secrets.MBENZIN_API_KEY }}
        run: python3 scripts/update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No price changes."
            exit 0
          fi
          git add data.json
          git commit -m "Update fuel prices ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
