name: Update fuel prices

on:
  schedule:
    # Times are Europe/Berlin during CEST (UTC+2); GitHub Actions cron is
    # always UTC and doesn't shift for daylight saving, so during CET
    # (winter) these fire an hour later in local time (08:00/14:00/20:00).
    - cron: "0 5 * * *"   # 07:00 Europe/Berlin - morning
    - cron: "0 11 * * *"  # 13:00 Europe/Berlin - after Germany's 12:00 price-change window
    - cron: "0 17 * * *"  # 19:00 Europe/Berlin - evening
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: DEBUG diagnose mbenzin.cz blocking
        run: |
          echo "--- plain curl, simple UA ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -A "Mozilla/5.0" "https://www.mbenzin.cz/Ceny-benzinu-a-nafty/Kraslice" || true
          echo "--- curl, full browser-like headers ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
            -H "Accept-Language: cs-CZ,cs;q=0.9,en;q=0.8" \
            "https://www.mbenzin.cz/Ceny-benzinu-a-nafty/Kraslice" || true
          echo "--- curl -v (headers+body snippet on failure) ---"
          curl -sS -A "Mozilla/5.0" "https://www.mbenzin.cz/Ceny-benzinu-a-nafty/Kraslice" -D - -o /tmp/body.html || true
          echo "--- body first 40 lines ---"
          head -40 /tmp/body.html || true
          echo "--- runner egress IP ---"
          curl -sS https://ifconfig.me || true
          echo ""

      - name: Update data.json
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: python3 scripts/update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No price changes."
            exit 0
          fi
          git add data.json
          git commit -m "Update fuel prices ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
