name: Update fuel prices

on:
  schedule:
    # Times are Europe/Berlin during CEST (UTC+2); GitHub Actions cron is
    # always UTC and doesn't shift for daylight saving, so during CET
    # (winter) these fire an hour later in local time (08:00/14:00/20:00).
    - cron: "0 5 * * *"   # 07:00 Europe/Berlin - morning
    - cron: "0 11 * * *"  # 13:00 Europe/Berlin - after Germany's 12:00 price-change window
    - cron: "0 17 * * *"  # 19:00 Europe/Berlin - evening
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update data.json
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: python3 scripts/update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No price changes."
            exit 0
          fi
          git add data.json
          git commit -m "Update fuel prices ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
